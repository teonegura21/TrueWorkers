version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: mesteri_postgres
    environment:
      POSTGRES_DB: mesteri_db
      POSTGRES_USER: mesteri_user
      POSTGRES_PASSWORD: mesteri_pass
    ports:
      - "5432:5432"
    restart: always

  redis:
    image: redis:7-alpine
    container_name: mesteri_redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    restart: always

volumes:
  postgres_data:
  redis_data:
